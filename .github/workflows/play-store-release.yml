name: Play Store Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release-Track'
        type: choice
        required: true
        default: 'production'
        options:
          - production
          - beta
          - alpha
          - internal
      version_bump:
        description: 'Automatischer Versionssprung'
        type: choice
        required: true
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - none
      release_notes:
        description: 'Optionale Release-Notes (de-DE & en-US)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Bump version in version.properties, commit and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f version.properties ]; then
            echo "version.properties not found; initializing from project configuration..."
            init_code="1"
            init_name="0.1.0"
            if [ -f app/build.gradle.kts ]; then
              init_code=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | tr -dc '0-9' || true)
              init_name=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | cut -d'"' -f2 || true)
            elif [ -f package.json ]; then
              init_name=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version" 2>/dev/null || true)
            fi
            init_code="${init_code:-1}"
            init_name="${init_name:-0.1.0}"
            printf 'versionCode=%s\nversionName=%s\n' "$init_code" "$init_name" > version.properties
          fi

          current_code=$(grep -E '^versionCode=' version.properties | head -n 1 | cut -d'=' -f2- | tr -dc '0-9')
          current_name=$(grep -E '^versionName=' version.properties | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [ -z "$current_code" ] || [ -z "$current_name" ]; then
            echo "ERROR: versionCode or versionName missing in version.properties" >&2
            exit 1
          fi

          new_code=$((current_code + 1))

          bump="${{ inputs.version_bump }}"
          base_semver=$(printf '%s' "$current_name" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [[ "$base_semver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "ERROR: versionName '$current_name' does not start with X.Y.Z" >&2
            exit 1
          fi

          case "$bump" in
            major)
              new_name="$((major + 1)).0.0"
              ;;
            minor)
              new_name="${major}.$((minor + 1)).0"
              ;;
            patch)
              new_name="${major}.${minor}.$((patch + 1))"
              ;;
            none)
              new_name="$current_name"
              ;;
            *)
              echo "ERROR: Unsupported version_bump '$bump'" >&2
              exit 1
              ;;
          esac

          printf 'versionCode=%s\nversionName=%s\n' "$new_code" "$new_name" > version.properties
          echo "Updated version: ${current_name} (${current_code}) -> ${new_name} (${new_code})"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to v${new_name} (code ${new_code}) [skip ci]"
          git push origin HEAD:main

          tag_name="v${new_name}"
          if ! git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            git tag -a "${tag_name}" -m "Release ${tag_name} (versionCode ${new_code})"
            git push origin "refs/tags/${tag_name}"
          else
            echo "Tag ${tag_name} already exists; skipping tag creation."
          fi

          echo "version_code=${new_code}" >> "$GITHUB_OUTPUT"
          echo "version_name=${new_name}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js (Capacitor projects)
        if: hashFiles('capacitor.config.ts') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Capacitor Android project
        if: hashFiles('capacitor.config.ts') != ''
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm run build
          npx cap add android
          npm run android:sync

      - name: Set up Gradle
        if: hashFiles('capacitor.config.ts') == ''
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize temporary signing & Play credentials
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077

          for var_name in SIGNING_KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!var_name:-}" ]; then
              echo "ERROR: Required GitHub Secret '$var_name' is missing or empty. See PLAY_RELEASE_SETUP.md." >&2
              exit 1
            fi
          done

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

          test -s "$RUNNER_TEMP/release-keystore.jks"
          test -s "$RUNNER_TEMP/play-service-account.json"

      - name: Write Play Store release notes
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -z "${INPUT_RELEASE_NOTES// }" ]; then
            echo "No release_notes provided; skipping release notes files."
            exit 0
          fi

          if [ -f capacitor.config.ts ]; then
            gradle_dir="android"
          else
            gradle_dir="."
          fi

          for locale in de-DE en-US; do
            notes_dir="${gradle_dir}/app/src/main/play/release-notes/${locale}"
            mkdir -p "$notes_dir"
            printf '%s\n' "$INPUT_RELEASE_NOTES" > "${notes_dir}/default.txt"
          done

      - name: Build signed AAB and publish to Google Play
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
          PLAY_TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          if [ -f capacitor.config.ts ]; then
            cd android
          fi
          chmod +x gradlew
          ./gradlew publishReleaseBundle --no-daemon

      - name: Clean up temporary secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release-keystore.jks" "$RUNNER_TEMP/play-service-account.json"
