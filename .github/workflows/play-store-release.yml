name: Play Store Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release-Track'
        type: choice
        required: true
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
      version_bump:
        description: 'Automatischer Versionssprung'
        type: choice
        required: true
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - none
      release_notes:
        description: 'Optionale Release-Notes (de-DE & en-US)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-publish:
    name: Build, Verify & Publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Compute next version in version.properties (local, uncommitted)
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f version.properties ]; then
            echo "ERROR: version.properties not found." >&2
            exit 1
          fi

          current_code=$(grep -E '^versionCode=' version.properties | head -n 1 | cut -d'=' -f2- | tr -dc '0-9')
          current_name=$(grep -E '^versionName=' version.properties | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [ -z "$current_code" ] || [ -z "$current_name" ]; then
            echo "ERROR: versionCode or versionName missing in version.properties" >&2
            exit 1
          fi

          new_code=$((current_code + 1))

          bump="${{ inputs.version_bump }}"
          base_semver=$(printf '%s' "$current_name" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [[ "$base_semver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "ERROR: versionName '$current_name' does not start with X.Y.Z" >&2
            exit 1
          fi

          case "$bump" in
            major)
              new_name="$((major + 1)).0.0"
              ;;
            minor)
              new_name="${major}.$((minor + 1)).0"
              ;;
            patch)
              new_name="${major}.${minor}.$((patch + 1))"
              ;;
            none)
              new_name="$current_name"
              ;;
            *)
              echo "ERROR: Unsupported version_bump '$bump'" >&2
              exit 1
              ;;
          esac

          printf 'versionCode=%s\nversionName=%s\n' "$new_code" "$new_name" > version.properties
          echo "Prepared version: ${current_name} (${current_code}) -> ${new_name} (${new_code})"

          echo "version_code=${new_code}" >> "$GITHUB_OUTPUT"
          echo "version_name=${new_name}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify docs version consistency
        run: ./scripts/check-docs-version.sh

      - name: Materialize temporary signing & Play credentials
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077

          for var_name in SIGNING_KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!var_name:-}" ]; then
              echo "ERROR: Required GitHub Secret '$var_name' is missing or empty. See PLAY_RELEASE_SETUP.md." >&2
              exit 1
            fi
          done

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

          test -s "$RUNNER_TEMP/release-keystore.jks"
          test -s "$RUNNER_TEMP/play-service-account.json"

      - name: Run unit tests, release lint and build signed AAB
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --no-daemon

      - name: Verify 16 KB ELF Page Alignment on signed AAB
        run: |
          python3 - app/build/outputs/bundle/release/app-release.aab <<'PY'
          import os, struct, sys, zipfile
          from collections import defaultdict

          aab = sys.argv[1]
          total_bytes = os.path.getsize(aab)
          abi_sizes = defaultdict(int)
          bad = []
          checked = 0
          with zipfile.ZipFile(aab) as zf:
              for info in zf.infolist():
                  if info.filename.endswith(".so"):
                      parts = info.filename.split("/")
                      abi = parts[-2] if len(parts) >= 2 else "unknown"
                      abi_sizes[abi] += info.file_size
                      data = zf.read(info.filename)
                      if len(data) >= 64 and data[:4] == b"\x7fELF" and data[4] == 2:
                          checked += 1
                          e_phoff = struct.unpack_from("<Q", data, 32)[0]
                          e_phentsize, e_phnum = struct.unpack_from("<HH", data, 54)
                          aligns = []
                          for i in range(e_phnum):
                              off = e_phoff + i * e_phentsize
                              p_type, _, _, _, _, _, _, p_align = struct.unpack_from("<IIQQQQQQ", data, off)
                              if p_type == 1:
                                  aligns.append(p_align)
                          if not aligns or any(a < 16384 for a in aligns):
                              bad.append((info.filename, aligns))
          print(f"AAB size: {total_bytes / (1024 * 1024):.2f} MiB ({total_bytes} bytes)")
          for abi, sz in sorted(abi_sizes.items()):
              print(f"  ABI {abi} uncompressed native libs: {sz / (1024 * 1024):.2f} MiB")
          print(f"Verified {checked} 64-bit .so libraries: 16KB_ALIGN_OK={len(bad) == 0}")
          if bad:
              for name, aligns in bad:
                  print(f"ERROR: {name} PT_LOAD alignment < 16KB: {aligns}")
              sys.exit(1)
          PY

      - name: Write Play Store release notes
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -z "${INPUT_RELEASE_NOTES// }" ]; then
            echo "No release_notes provided; skipping release notes files."
            exit 0
          fi

          for locale in de-DE en-US; do
            notes_dir="app/src/main/play/release-notes/${locale}"
            mkdir -p "$notes_dir"
            printf '%s\n' "$INPUT_RELEASE_NOTES" > "${notes_dir}/default.txt"
          done

      - name: Publish verified AAB to Google Play
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
          PLAY_TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          ./gradlew :app:publishReleaseBundle --no-daemon

      - name: Commit bumped version.properties and push release tag
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_CODE: ${{ steps.version.outputs.version_code }}
          NEW_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to v${NEW_NAME} (code ${NEW_CODE}) [skip ci]"
          if ! git push origin HEAD:main; then
            echo "Direct push to main blocked by branch protection; creating and merging release PR..."
            release_branch="chore/release-v${NEW_NAME}-c${NEW_CODE}"
            git push -f origin "HEAD:refs/heads/${release_branch}"
            pr_url=$(gh pr create --base main --head "${release_branch}" \
              --title "chore(release): bump version to v${NEW_NAME} (code ${NEW_CODE}) [skip ci]" \
              --body "Automated version bump from Play Store Release workflow.")
            gh pr merge "$pr_url" --squash --delete-branch
            git fetch origin main
            git checkout -B main origin/main
          fi

          tag_name="v${NEW_NAME}"
          if ! git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            git tag -a "${tag_name}" -m "Release ${tag_name} (versionCode ${NEW_CODE})"
            git push origin "refs/tags/${tag_name}"
          else
            echo "Tag ${tag_name} already exists; skipping tag creation."
          fi

      - name: Clean up temporary secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release-keystore.jks" "$RUNNER_TEMP/play-service-account.json"
