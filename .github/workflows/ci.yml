name: Tapwing CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Unit Tests, Lint & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify docs and Play Store versions match app/build.gradle.kts
        run: ./scripts/check-docs-version.sh

      - name: Build Debug, Unit Tests, Lint, AndroidTest APK & Kover Report
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:koverXmlReport --no-daemon

      - name: Upload Kover Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: app/build/reports/kover/report.xml
          if-no-files-found: warn

      - name: Upload Android Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  release-aab-check:
    name: Unsigned Release AAB & 16 KB ELF Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Unsigned Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Verify 16 KB ELF Page Alignment & Report AAB Size per ABI
        run: |
          python3 - app/build/outputs/bundle/release/app-release.aab <<'PY'
          import os, struct, sys, zipfile
          from collections import defaultdict

          aab = sys.argv[1]
          total_bytes = os.path.getsize(aab)
          abi_sizes = defaultdict(int)
          bad = []
          checked = 0
          with zipfile.ZipFile(aab) as zf:
              for info in zf.infolist():
                  if info.filename.endswith(".so"):
                      parts = info.filename.split("/")
                      abi = parts[-2] if len(parts) >= 2 else "unknown"
                      abi_sizes[abi] += info.file_size
                      data = zf.read(info.filename)
                      if len(data) >= 64 and data[:4] == b"\x7fELF" and data[4] == 2:
                          checked += 1
                          e_phoff = struct.unpack_from("<Q", data, 32)[0]
                          e_phentsize, e_phnum = struct.unpack_from("<HH", data, 54)
                          aligns = []
                          for i in range(e_phnum):
                              off = e_phoff + i * e_phentsize
                              p_type, _, _, _, _, _, _, p_align = struct.unpack_from("<IIQQQQQQ", data, off)
                              if p_type == 1:
                                  aligns.append(p_align)
                          if not aligns or any(a < 16384 for a in aligns):
                              bad.append((info.filename, aligns))
          print(f"AAB size: {total_bytes / (1024 * 1024):.2f} MiB ({total_bytes} bytes)")
          for abi, sz in sorted(abi_sizes.items()):
              print(f"  ABI {abi} uncompressed native libs: {sz / (1024 * 1024):.2f} MiB")
          print(f"Verified {checked} 64-bit .so libraries: 16KB_ALIGN_OK={len(bad) == 0}")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(f"### Release AAB Summary\n")
                  fh.write(f"- **AAB Size:** {total_bytes / (1024 * 1024):.2f} MiB (`{total_bytes}` bytes)\n")
                  fh.write(f"- **16 KB ELF Alignment:** `{'PASS' if not bad else 'FAIL'}` ({checked} 64-bit libraries)\n")
                  for abi, sz in sorted(abi_sizes.items()):
                      fh.write(f"- **Native `{abi}` (uncompressed):** {sz / (1024 * 1024):.2f} MiB\n")
          if bad:
              sys.exit(1)
          PY

      - name: Upload Unsigned Release AAB Size Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
