version = 1
SPDX-PackageName = "Tapwing"
SPDX-PackageSupplier = "Manuel Blasaditsch"
SPDX-PackageDownloadLocation = "https://github.com/mixxermannipro/tapwing-keyboard"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright 2026 Manuel Blasaditsch"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["LICENSE", "LICENSES/GPL-3.0-or-later.txt", "LICENSE-EXCEPTION.md", "TRADEMARKS.md", "docs/licensing.md"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2026 Manuel Blasaditsch"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "LICENSES/Apache-2.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"
